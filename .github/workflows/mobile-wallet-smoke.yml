name: Mobile Wallet Browser Smoke Test
on:
  workflow_dispatch:
  push:
    paths:
      - 'v3-alpha/index.html'
      - 'v3-alpha/assets/metamask-connect-2.1.1.js'
      - '.github/workflows/mobile-wallet-smoke.yml'
      - '.github/scripts/mobile-wallet-smoke.cjs'
jobs:
  android-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test deployed mobile wallet connector
        run: node .github/scripts/mobile-wallet-smoke.cjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-wallet-diagnostics
          path: mobile-wallet-diagnostics/
          if-no-files-found: ignore
